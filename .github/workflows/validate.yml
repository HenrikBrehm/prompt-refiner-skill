name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run skill validator
        run: bash scripts/validate-skill.sh

      - name: Run conformance suite
        run: bash scripts/run-tests.sh
